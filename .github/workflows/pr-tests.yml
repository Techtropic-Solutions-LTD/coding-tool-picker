name: PR Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test and Build
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test
      
      - name: Run persona tests
        run: npm run test:personas
      
      - name: Build site
        run: npm run build
      
      - name: Check build artifacts
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: index.html not built"
            exit 1
          fi
          echo "Build artifacts present"
          ls -lh dist/

      - name: Validate Wrangler config and bundling
        run: npx wrangler deploy --dry-run
