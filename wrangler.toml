name = "coding-tool-picker"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[observability]
enabled = true

[[routes]]
pattern = "bot-picker.techtropic.io"
custom_domain = true

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "coding_tool_picker_rl"
simple = { limit = 10, period = 60 }
