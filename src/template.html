<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which AI coding tool and plan fits you? | Techtropic</title>
<meta name="description" content="Nine questions. Cursor, Claude Code, Codex, API keys and sensible stacks, scored against our research, with the working shown. Powered by Jev decision engine.">
<link rel="canonical" href="https://bot-picker.techtropic.io">
<meta property="og:type" content="website">
<meta property="og:title" content="Which AI coding tool and plan fits you?">
<meta property="og:description" content="Nine questions about your work, how you like to work, and your budget. Scored by Jev against research on Cursor, Claude Code, Codex and API keys.">
<meta property="og:url" content="https://bot-picker.techtropic.io">
<meta property="og:site_name" content="Techtropic">
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #f0f2f8; --line: #dde1ec; --line-2: #c3c9da;
  --text: #141a2a; --text-2: #3d4560; --muted: #5f6782;
  --accent: #3446d6; --accent-2: #e8ebff; --on-accent: #ffffff;
  --ok: #17784a; --ok-bg: #e6f5ec; --no: #b3261e; --no-bg: #fdeceb; --warn: #8a5a00; --warn-bg: #fff4dc;
  --r: 14px; --shadow: 0 1px 2px rgba(20, 26, 42, .06), 0 6px 24px rgba(20, 26, 42, .06);
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1320; --surface: #171c2c; --surface-2: #1e2438; --line: #2b3350; --line-2: #3b4568; --text: #eef1fb; --text-2: #c6cbe0; --muted: #9aa2c0;
        --accent: #8f9bff; --accent-2: #262d52; --on-accent: #0f1320; --ok: #6fd69d; --ok-bg: #16301f; --no: #ff8f86; --no-bg: #3a1b1a; --warn: #f2c25b; --warn-bg: #352a12;
        --shadow: none; }
}
* { box-sizing: border-box }
html, body { margin: 0; background: var(--bg); color: var(--text) }
body { font-family: var(--ui); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased }
h1, h2, h3, p, ul, ol, fieldset, figure { margin: 0; padding: 0 }
ul, ol { list-style: none }
fieldset { border: 0; min-width: 0 }
a { color: var(--accent); text-underline-offset: 3px }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px }
[data-focus]:focus { outline: none }
[hidden] { display: none !important }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.skip { position: absolute; left: 8px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 12px; border-radius: 8px; z-index: 10 }
.skip:focus { top: 8px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px clamp(16px, 4vw, 32px); border-bottom: 1px solid var(--line); background: var(--surface) }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px }
.brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent) }
.asof { font-family: var(--mono); font-size: 12px; color: var(--muted) }
.wrap { max-width: 760px; margin: 0 auto; padding: clamp(22px, 5vw, 44px) clamp(16px, 4vw, 32px) 32px }
.wrap.wide { max-width: 920px }
.kicker { font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent) }

.btn { font: inherit; font-size: 15px; font-weight: 600; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-height: 44px }
.btn:hover:not(:disabled) { border-color: var(--text) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent) }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08) }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2) }
.btn.small { font-size: 14px; padding: 7px 14px; min-height: 36px }
.btn:disabled { opacity: .4; cursor: not-allowed }

.intro { display: grid; gap: 20px }
.display { font-size: clamp(34px, 7vw, 56px); line-height: 1.05; letter-spacing: -.03em; font-weight: 800; text-wrap: balance }
.dek { font-size: clamp(17px, 2.2vw, 19px); color: var(--text-2); max-width: 36em }
.cta { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap }
.meta { font-size: 14px; color: var(--muted) }
.how { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)) }
.how li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; font-size: 15px; color: var(--text-2) }
.how b { color: var(--text); font-size: 16px }
.field { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) }
.field li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; color: var(--text-2) }
.field b { display: block; color: var(--text); font-size: 15px }
.sec-label { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px }
.sec-label i { flex: 1; height: 1px; background: var(--line) }

.progress { display: flex; gap: 5px; margin-bottom: 18px }
.progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line) }
.progress i.done { background: var(--accent) }
.progress i.now { background: linear-gradient(90deg, var(--accent) 50%, var(--line) 50%) }
.q-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px }
.count { font-size: 14px; color: var(--muted) }
.q-h { font-size: clamp(24px, 4.4vw, 34px); line-height: 1.15; letter-spacing: -.02em; font-weight: 750; text-wrap: balance }
.q-sub { color: var(--text-2); margin-top: 8px; font-size: 16px }
.opts { display: grid; gap: 10px; margin-top: 20px }
.opts.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)) }
.opts.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px }
.opt { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: center; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; min-height: 52px }
.opt:hover { border-color: var(--line-2) }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px }
.opt .ind { grid-row: span 2; width: 20px; height: 20px; border: 2px solid var(--line-2); border-radius: 50% }
.opt .ind.checkbox { border-radius: 6px }
.opt.on { border-color: var(--accent); background: var(--accent-2) }
.opt.on .ind { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface) }
.opt.dis { opacity: .5; cursor: not-allowed }
.opt:focus-within { outline: 3px solid var(--accent); outline-offset: 2px }
.o-t { font-weight: 600 }
.o-d { grid-column: 2; font-size: 14.5px; color: var(--muted) }
.chips .opt { grid-template-columns: auto; padding: 9px 16px; min-height: 44px; border-radius: 999px }
.chips .opt .ind { display: none }
.part { margin-top: 22px }
.part-l { font-weight: 700; font-size: 16px }
.follow { margin-top: 24px; padding-top: 18px; border-top: 1px dashed var(--line-2) }
.q-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; gap: 12px }
.check-box { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--r); padding: 20px }

.result { display: grid; gap: 22px }
.banner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--accent-2); border-radius: 12px; padding: 10px 14px; font-size: 15px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 28px); box-shadow: var(--shadow); display: grid; gap: 12px }
.card-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.r-name { font-size: clamp(28px, 6vw, 44px); line-height: 1.08; letter-spacing: -.025em; font-weight: 800; text-wrap: balance }
.r-price { font-size: 18px; font-weight: 700; color: var(--text-2) }
.r-blurb { color: var(--text-2) }
.fit { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px }
.fit-n { font-weight: 800; font-size: 20px }
.bar { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; border: 1px solid var(--line) }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px }
.jev { display: grid; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14.5px }
.jev-row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline }
.jev code, .mono { font-family: var(--mono); font-size: 13px }
.pill { display: inline-block; font-family: var(--mono); font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2) }
.pill.high { color: var(--ok); border-color: currentColor } .pill.mid { color: var(--warn); border-color: currentColor } .pill.low { color: var(--no); border-color: currentColor }
.share { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.share output { font-size: 14px; color: var(--ok) }
.callout { border-radius: 12px; padding: 14px 16px; background: var(--warn-bg); border: 1px solid var(--line) }
.callout.info { background: var(--accent-2) }
.c-lbl { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px }
.r-sec { display: grid; gap: 10px }
.r-list { display: grid; gap: 10px }
.r-list li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px }
.ico { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px }
.ok .ico { background: var(--ok-bg); color: var(--ok) } .no .ico { background: var(--no-bg); color: var(--no) } .warn .ico { background: var(--warn-bg); color: var(--warn) } .tip .ico { background: var(--accent-2); color: var(--accent) }
.ev { display: block; color: var(--text-2); font-size: 15px; margin-top: 2px }
.refs { font-family: var(--mono); font-size: 12px; white-space: nowrap }
.refs a { text-decoration: none }
.unv { display: inline-block; margin-left: 4px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--warn); background: var(--warn-bg); border: 1px solid currentColor; border-radius: 6px; padding: 0 6px }
.unv-why { display: block; font-size: 13.5px; color: var(--warn); margin-top: 2px }
.tension { background: var(--surface); border: 1.5px solid var(--warn); border-radius: 14px; padding: 16px; display: grid; gap: 10px }
.t-sides { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center }
.t-side { display: grid; gap: 2px; font-size: 15px }
.t-ans { font-weight: 700 }
.t-vs { font-family: var(--mono); color: var(--muted) }
.t-choice { display: flex; flex-wrap: wrap; gap: 8px }
.t-choice button { font: inherit; font-size: 14.5px; padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface); color: var(--text); cursor: pointer; text-align: left; min-height: 44px }
.t-choice button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-2) }
.linkbtn { font: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0 }
.scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table.score { border-collapse: collapse; width: 100%; font-size: 14.5px; min-width: 560px }
.score th, .score td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle }
.score thead th { font-size: 13px; color: var(--muted); font-weight: 700 }
.score th[scope="row"] { font-weight: 600 }
.score td.num { font-family: var(--mono); font-size: 13px; white-space: nowrap }
.score .win { background: var(--accent-2) }
.score tfoot th, .score tfoot td { font-weight: 800; border-bottom: 0 }
.cellbtn { font: inherit; font-family: var(--mono); font-size: 13px; background: none; border: 0; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 4px; border-radius: 6px }
.cellbtn .mini { width: 34px; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden }
.cellbtn .mini i { display: block; height: 100%; background: var(--accent) }
.ev-out { font-size: 14.5px; color: var(--text-2); min-height: 1.5em }
.fine { font-size: 14px; color: var(--muted) }
.chg { color: var(--warn); font-weight: 700 }
.rank { display: grid; gap: 6px }
.rk { display: grid; grid-template-columns: minmax(0, 15em) 1fr 3.5em; gap: 10px; align-items: center; font-size: 14.5px }
.rk .rk-v { font-family: var(--mono); text-align: right }
.rk.win .rk-name { font-weight: 800 }
.rk.out { grid-template-columns: minmax(0, 15em) 1fr; color: var(--muted) }
@media (max-width: 560px) { .rk { grid-template-columns: minmax(0, 1fr) 70px 3.2em } .rk.out { grid-template-columns: 1fr } .t-sides { grid-template-columns: 1fr } .t-vs { display: none } }
.actions { display: flex; gap: 10px; flex-wrap: wrap }
.foot { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 20px; font-size: 14px; color: var(--text-2); display: grid; gap: 12px }
.foot h2 { font-size: 15px }
.foot ol { list-style: decimal; padding-left: 1.6em; display: grid; gap: 3px }
.foot ul.unv-list { list-style: disc; padding-left: 1.4em; display: grid; gap: 3px }
.foot .asof-note { font-weight: 700; color: var(--text) }
.foot .made-by { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center }
.foot .made-by a { font-weight: 600 }
details summary { cursor: pointer; font-weight: 700 }
</style>
</head>
